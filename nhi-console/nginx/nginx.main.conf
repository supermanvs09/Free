# Main nginx config for the image. nginx runs as the unprivileged `nginx`
# user (Dockerfile: USER nginx), so:
#   - no `user` directive (only meaningful for a root master), and
#   - the PID file lives in /tmp, which that user can write and remove
#     (/run is root-owned: "unlink() /run/nginx.pid failed (13)").
worker_processes auto;
pid /tmp/nginx.pid;
error_log /var/log/nginx/error.log notice;  # the image links this to stderr

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;  # linked to stdout by the image

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    # Writable temp paths for a non-root nginx.
    client_body_temp_path /var/cache/nginx/client_temp;
    proxy_temp_path       /var/cache/nginx/proxy_temp;
    fastcgi_temp_path     /var/cache/nginx/fastcgi_temp;
    uwsgi_temp_path       /var/cache/nginx/uwsgi_temp;
    scgi_temp_path        /var/cache/nginx/scgi_temp;

    include /etc/nginx/conf.d/*.conf;
}
