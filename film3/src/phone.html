<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>phone</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; overflow: hidden; background: #f6f7fb; font-family: Inter, system-ui, sans-serif; color: #111827; -webkit-font-smoothing: antialiased; }
.v { position: absolute; left: 0; top: 0; width: 1080px; background: #f6f7fb; }
.sb { height: 96px; display: flex; align-items: flex-end; justify-content: space-between; padding: 0 64px 14px; font-size: 34px; font-weight: 650; }
.hd { display: flex; align-items: center; gap: 26px; padding: 26px 56px 18px; }
.hd .bk { width: 64px; height: 64px; border-radius: 50%; background: #eef0f6; display: grid; place-items: center; font-size: 36px; color: #374151; }
.hd b { font-size: 52px; letter-spacing: -.02em; }
.srch { margin: 18px 56px 0; height: 104px; border-radius: 28px; background: #fff; border: 2px solid #e6e8f0; display: flex; align-items: center; padding: 0 36px; font-size: 34px; color: #9ca3af; }
.lbl { margin: 40px 56px 14px; font-size: 30px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; color: #6b7280; }
.row { display: flex; align-items: center; gap: 30px; padding: 26px 56px; font-size: 38px; position: relative; }
.av { width: 104px; height: 104px; border-radius: 50%; display: grid; place-items: center; font-size: 42px; font-weight: 700; flex: none; }
.row small { display: block; font-size: 29px; color: #6b7280; margin-top: 6px; }
.row b { font-weight: 650; }
.rip { position: absolute; inset: 6px 30px; border-radius: 24px; background: rgba(11,110,91,.10); }
.amt { text-align: center; }
.big { font: 700 150px/1 Inter, sans-serif; letter-spacing: -.04em; }
.keys { position: absolute; left: 0; right: 0; bottom: 60px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; padding: 0 60px; }
.keys div { height: 150px; display: grid; place-items: center; font-size: 62px; font-weight: 500; border-radius: 30px; }
.btn { margin: 0 56px; height: 140px; border-radius: 36px; background: #0b6e5b; color: #fff; display: grid; place-items: center; font-size: 44px; font-weight: 650; }
.card { margin: 0 56px; border-radius: 34px; background: #fff; border: 2px solid #eceef4; padding: 40px 44px; }
.kv { display: flex; justify-content: space-between; padding: 22px 0; font-size: 34px; border-top: 2px solid #f1f2f6; }
.kv:first-child { border-top: 0; }
.kv span { color: #6b7280; }
</style></head>
<body><div id="app"></div>
<script>
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)), seg = (t, a, b) => clamp((t - a) / (b - a));
const ease = (x) => 1 - Math.pow(1 - x, 3), H = +new URLSearchParams(location.search).get('h') || 1920;
document.documentElement.style.height = document.body.style.height = H + 'px';
const app = document.getElementById('app');
const TEAL = '#0b6e5b';
const status = '<div class="sb"><span>16:21</span><span>5G ▮▮▮ ▭</span></div>';
const contacts = [['R', 'Rohan Mehta', 'rohan.m@yourbank', '#e7ecfb', '#3b5bdb'], ['P', 'Priya Sharma', '98••• ••214', '#fdeee4', '#c2410c'], ['A', 'Amma', 'amma@yourbank', '#dcf3ea', TEAL], ['⚡', 'Power bill', 'Due in 4 days', '#fef7dc', '#a16207']];
function list(sel) {
  return status + `<div class="hd"><div class="bk">‹</div><b>Send money</b></div><div class="srch">Name, UPI ID or mobile number</div>
    <div class="lbl" style="margin-top:46px">Quick actions</div><div style="display:grid;grid-template-columns:repeat(4,1fr);margin:0 40px;text-align:center;font-size:28px;color:#374151">${['Scan QR', 'To bank A/c', 'To UPI ID', 'Self transfer'].map((x) => `<div><div style="width:120px;height:120px;margin:0 auto 14px;border-radius:34px;background:#fff;border:2px solid #eceef4"></div>${x}</div>`).join('')}</div>
    <div class="lbl" style="margin-top:56px">Recent</div>` +
    contacts.map(([i, n, s, bg, fg], k) => `<div class="row">${k === 2 && sel ? `<div class="rip" style="opacity:${sel.toFixed(2)}"></div>` : ''}<div class="av" style="background:${bg};color:${fg}">${i}</div><div style="position:relative"><b>${n}</b><small>${s}</small></div></div>`).join('');
}
function amount(digits) {
  const n = digits ? '₹' + Number(digits).toLocaleString('en-IN') : '<span style="color:#c4c8d2">₹0</span>';
  return status + `<div class="hd"><div class="bk">‹</div><b>Pay Amma</b></div>
    <div style="text-align:center;margin-top:30px"><div class="av" style="margin:0 auto;background:#dcf3ea;color:${TEAL};width:150px;height:150px;font-size:60px">A</div><div style="font-size:36px;margin-top:20px;font-weight:600">Amma</div><div style="font-size:29px;color:#6b7280;margin-top:6px">amma@yourbank</div></div>
    <div class="amt" style="margin-top:60px"><div class="big">${n}</div><div style="margin:34px auto 0;display:inline-block;padding:16px 30px;border-radius:24px;background:#fff;border:2px solid #eceef4;font-size:30px;color:#6b7280">Add a note</div></div>
    <div class="keys">${['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', '⌫'].map((k) => `<div data-k="${k}">${k}</div>`).join('')}</div>`;
}
function review(state, k) {
  if (state === 'done') return status + `<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:${H - 96}px;text-align:center">
    <div style="width:${(220 * (0.8 + 0.2 * k)).toFixed(0)}px;height:${(220 * (0.8 + 0.2 * k)).toFixed(0)}px;border-radius:50%;background:${TEAL};display:grid;place-items:center"><svg width="120" height="120" viewBox="0 0 24 24"><path d="M5 12.5l4.2 4.2L19 7" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="${k.toFixed(3)} 1"/></svg></div>
    <div style="font:700 96px/1 Inter;letter-spacing:-.03em;margin-top:60px">₹12,500</div><div style="font-size:38px;margin-top:22px;color:#374151">Paid to Amma</div><div style="font-size:28px;color:#9ca3af;margin-top:40px">UPI ref 4182 7731 0921</div></div>`;
  return status + `<div class="hd"><div class="bk">‹</div><b>Review payment</b></div>
    <div style="text-align:center;margin:40px 0 46px"><div style="font-size:32px;color:#6b7280">Paying Amma</div><div class="big" style="margin-top:20px">₹12,500</div></div>
    <div class="card">${[['To', 'Amma · amma@yourbank'], ['From', 'Savings ••4821'], ['Note', 'Groceries'], ['Mode', 'UPI']].map(([a, b]) => `<div class="kv"><span>${a}</span><b>${b}</b></div>`).join('')}</div>
    <div style="position:absolute;left:0;right:0;bottom:${H > 2000 ? 300 : 200}px"><div class="btn" style="${state === 'press' ? 'transform:scale(.97);background:#095a4a' : ''}">${state === 'proc' ? '<span style="opacity:.85">Processing…</span>' : 'Pay ₹12,500'}</div><div style="text-align:center;font-size:28px;color:#9ca3af;margin-top:26px">Secured by Your Bank</div></div>`;
}
window.render = (shot, lt) => {
  let h = '';
  if (shot === 'p1') {   // tap on Amma at 2.0 s, then the amount screen slides in
    const sel = seg(lt, 1.95, 2.1) * (1 - seg(lt, 2.35, 2.5)), sl = ease(seg(lt, 2.3, 2.75));
    h = `<div class="v" style="height:${H}px;transform:translateX(${(-sl * 100).toFixed(2)}%)">${list(sel)}</div><div class="v" style="height:${H}px;transform:translateX(${((1 - sl) * 100).toFixed(2)}%)">${amount('')}</div>`;
  } else if (shot === 'p2') {   // digits land on the finger's taps
    const taps = [[0.45, '1'], [1.0, '2'], [1.6, '5'], [2.2, '0'], [2.75, '0']];
    const d = taps.filter(([t]) => lt >= t).map(([, k]) => k).join('');
    const last = taps.filter(([t]) => lt >= t && lt < t + 0.18).map(([, k]) => k)[0];
    h = `<div class="v" style="height:${H}px">${amount(d)}</div>` + (last ? `<style>[data-k="${last}"]{background:#e6ece9}</style>` : '');
  } else if (shot === 'p3') {   // tap Pay at 1.5 s
    const st = lt < 1.45 ? 'idle' : lt < 1.62 ? 'press' : lt < 2.35 ? 'proc' : 'done';
    h = `<div class="v" style="height:${H}px">${review(st, ease(seg(lt, 2.35, 2.9)))}</div>`;
  }
  app.innerHTML = h;
};
</script></body></html>
