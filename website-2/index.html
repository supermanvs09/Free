<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#f5f7fb" />
    <script>(function(){var r=document.documentElement;r.classList.add('js');try{if(localStorage.getItem('da2-theme')==='dark'){r.setAttribute('data-theme','dark');document.querySelector('meta[name=theme-color]').setAttribute('content','#070a12')}}catch(e){}r.style.colorScheme=r.getAttribute('data-theme')})();</script>
    <!--app-head-->
      <script>
      /* home intro: cover the page before it paints, so the menu never flashes before the logo */
      try { if (location.pathname === '/' && (sessionStorage.getItem('da-intro') !== '1' || location.search.indexOf('intro') > -1) && !navigator.webdriver && !matchMedia('(prefers-reduced-motion: reduce)').matches) { document.documentElement.classList.add('intro-pre'); ['mark-stroke', 'mark-bowl', 'wordmark-inverse'].forEach(function (n) { var l = document.createElement('link'); l.rel = 'preload'; l.as = 'image'; l.href = '/brand/' + n + '.webp'; document.head.appendChild(l); }); } } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
