# Sent with every response. nginx drops server-level add_header lines in any
# location that sets its own, so each such location includes this file again.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Browsers apply HSTS only over HTTPS, so this is safe behind a TLS terminator.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# Content-Security-Policy, generated from the built pages by scripts/csp.mjs
include /etc/nginx/snippets/csp.conf;
