# deepalgorithms.io: the prerendered site, served the way Vercel/Netlify serve it.
#   /trust -> trust/index.html, unknown paths -> 404.html with status 404,
#   hashed assets cached for a year, pages always revalidated, film streams with ranges.
# Runs unprivileged on 8080; put TLS in front (load balancer, Cloudflare or a proxy).

server {
    listen 8080;   # IPv4; add 'listen [::]:8080;' where the host has IPv6
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    server_tokens off;
    absolute_redirect off;          # redirects keep the host and port the visitor used
    port_in_redirect off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css text/plain text/vtt text/javascript application/javascript application/json
               application/ld+json application/manifest+json application/xml image/svg+xml;

    include /etc/nginx/snippets/security-headers.conf;

    error_page 404 /404.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # pages removed in the redesign
    location = /svg-export { return 301 /; }
    location = /verify     { return 301 /; }
    # the company page and the old Why page became one page
    location = /platform   { return 301 /products$is_args$args; }
    location = /ad-security { return 301 /adapid-ai/active-directory-security$is_args$args; }

    # one address per page: /trust/ -> /trust
    location ~ ^(.+)/$ {
        return 301 $1$is_args$args;
    }

    # fingerprinted JS and CSS never change: cache for a year
    location ^~ /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # images, icons, the film and captions: cache for a week
    location ~* ^/(img|brand|og|video)/|\.(?:ico|png|webp|svg|woff2|webmanifest)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # pages: always revalidate, so a deploy shows at once
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/index.html $uri.html =404;
    }

    location = /404.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        internal;
    }
}
