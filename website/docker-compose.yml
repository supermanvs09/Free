# docker compose up --build -d     -> http://localhost:8080
services:
  web:
    build:
      context: .
    image: deepalgorithms-website:latest
    container_name: deepalgorithms-website
    ports:
      - "8080:8080"
    restart: unless-stopped
    # hardened: read-only filesystem, no Linux capabilities, no privilege escalation
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
