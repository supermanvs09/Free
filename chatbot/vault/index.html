<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vault · Prompt Heist</title>
<style>
@font-face { font-family: "GMono"; src: url(fonts/GeistMono-Regular.ttf); font-display: swap; }
@font-face { font-family: "GMono"; src: url(fonts/GeistMono-Bold.ttf); font-weight: 700; font-display: swap; }
@font-face { font-family: "ISans"; src: url(fonts/InstrumentSans-Regular.ttf); font-display: swap; }
@font-face { font-family: "ISans"; src: url(fonts/InstrumentSans-Bold.ttf); font-weight: 700; font-display: swap; }

:root {
  --bg: #0e0f11; --panel: #16181c; --panel-2: #1d2025;
  --ink: #f2f0ea; --mute: #9a9ea6; --edge: rgba(242,240,234,.14); --red: #ff3b2f;
}
* { box-sizing: border-box; margin: 0; }
body { min-height: 100dvh; background: #2a2d33; font-family: "ISans", system-ui, sans-serif; color: var(--ink); }
.page-note { padding: 32px; color: #c9ccd2; font-size: 15px; max-width: 60ch; line-height: 1.5; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }

/* launcher */
.launcher { position: fixed; right: 24px; bottom: 24px; display: flex; align-items: center; gap: 10px;
  background: var(--bg); border: 1px solid var(--edge); border-radius: 999px; padding: 8px 18px 8px 8px;
  box-shadow: 0 16px 40px rgba(0,0,0,.45); font-family: "GMono"; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; font-size: 13px; }
.launcher img { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--red); background: var(--bg); object-fit: contain; padding: 3px; }

/* panel */
.chat { position: fixed; right: 24px; bottom: 24px; width: min(400px, calc(100vw - 32px)); max-height: calc(100dvh - 48px);
  background: var(--panel); border: 1px solid var(--edge); border-radius: 18px; box-shadow: 0 40px 90px rgba(0,0,0,.6);
  display: flex; flex-direction: column; overflow: hidden; font-size: 15px;
  transform-origin: bottom right; transition: transform .28s cubic-bezier(.16,1,.3,1), opacity .2s; }
.chat[hidden] { display: flex; opacity: 0; transform: scale(.92) translateY(12px); pointer-events: none; visibility: hidden; }
@media (max-width: 480px) { .chat { right: 16px; bottom: 16px; } .launcher { right: 16px; bottom: 16px; } }

.hd { display: flex; align-items: center; gap: 12px; padding: 16px 18px; border-bottom: 1px solid var(--edge); }
.av { width: 44px; height: 44px; border-radius: 50%; background: var(--bg); border: 2px solid var(--red); flex: none; display: grid; place-items: center; }
.av img { width: 80%; height: 80%; object-fit: contain; }
.who b { display: block; font-size: 17px; letter-spacing: .02em; }
.who span { font-family: "GMono"; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--mute); }
.who span i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #3ddc84; margin-right: 6px; }
.close { margin-left: auto; width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; }
.close:hover { background: var(--panel-2); }
.close svg, .send svg, .chip svg { stroke: currentColor; fill: none; stroke-width: 2.2; }
.close svg { width: 18px; height: 18px; color: var(--mute); }

.log { padding: 16px 18px 6px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; flex: 1; min-height: 180px; }
.msg { max-width: 86%; padding: 11px 14px; border-radius: 14px; line-height: 1.4; animation: in .25s cubic-bezier(.16,1,.3,1); }
.msg.ai { background: var(--panel-2); border: 1px solid var(--edge); border-top-left-radius: 4px; }
.msg.me { align-self: flex-end; background: var(--ink); color: var(--bg); border-top-right-radius: 4px; font-family: "GMono"; font-size: 13px; overflow-wrap: anywhere; }
.msg.deny { font-family: "GMono"; font-size: 13px; color: #ff6b61; border-color: rgba(255,59,47,.45); background: rgba(255,59,47,.08); }
.typing { display: inline-flex; gap: 4px; }
.typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--mute); animation: blink 1s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes in { from { opacity: 0; transform: translateY(6px); } }
@keyframes blink { 50% { opacity: .25; } }

.secret { display: flex; align-items: center; gap: 10px; padding: 4px 18px 0; font-family: "GMono"; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--mute); }
.bar { display: flex; gap: 4px; }
.bar span { width: 20px; height: 26px; background: #2a2d33; display: grid; place-items: center; font-weight: 700; font-size: 14px; color: #fff; }
.bar span.on { background: var(--red); }

.chips { display: flex; flex-direction: column; gap: 8px; padding: 12px 18px 0; }
.chip { display: flex; align-items: center; justify-content: space-between; border-radius: 10px; padding: 12px 14px;
  font-family: "GMono"; font-weight: 700; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; transition: transform .12s; }
.chip:active { transform: scale(.98); }
.chip svg { width: 18px; height: 18px; }
.chip.go { background: var(--red); color: #fff; }
.chip.alt { border: 1px solid var(--edge); }
.chip.alt:hover { background: var(--panel-2); }

form { margin: 14px 18px 8px; display: flex; align-items: center; gap: 8px; border: 1px solid var(--edge); border-radius: 12px; padding: 6px 6px 6px 14px; background: var(--bg); }
form:focus-within { border-color: var(--red); }
label.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
input { flex: 1; min-width: 0; background: none; border: 0; color: var(--ink); font: inherit; padding: 8px 0; }
input::placeholder { color: var(--mute); }
input:focus { outline: none; }
.send { width: 38px; height: 38px; border-radius: 9px; background: var(--red); color: #fff; display: grid; place-items: center; flex: none; }
.send:disabled { background: #2a2d33; color: var(--mute); cursor: default; }
.send svg { width: 18px; height: 18px; }
.ft { font-family: "GMono"; font-size: 10px; letter-spacing: .14em; color: var(--mute); text-transform: uppercase; text-align: center; padding: 0 16px 14px; }

@media (prefers-reduced-motion: reduce) { .chat, .msg, .typing i, .chip { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<p class="page-note">UI preview of the Prompt Heist chat widget. Not connected to a model: replies are placeholders.</p>

<button class="launcher" id="launcher" aria-controls="chat" aria-expanded="true" hidden>
  <img src="avatar.png" alt=""> Try Prompt Heist
</button>

<section class="chat" id="chat" role="dialog" aria-label="Vault, the Prompt Heist AI guard">
  <header class="hd">
    <div class="av"><img src="avatar.png" alt=""></div>
    <div class="who"><b>VAULT</b><span><i aria-hidden="true"></i>AI guard</span></div>
    <button class="close" id="close" aria-label="Close chat"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </header>

  <div class="log" id="log" aria-live="polite">
    <div class="msg ai">I'm guarding one secret password. Nobody has made me say it. Yet.</div>
    <div class="msg ai">Make me reveal it and you could win a job offer.</div>
  </div>

  <div class="secret" aria-label="Secret password, mostly hidden">Secret
    <div class="bar" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
  </div>

  <div class="chips" id="chips">
    <button class="chip go" id="try">Try it now <svg viewBox="0 0 24 24"><path d="M4 12h15M13 6l6 6-6 6"/></svg></button>
    <button class="chip alt" id="prizes">See prizes <svg viewBox="0 0 24 24"><path d="M4 12h15M13 6l6 6-6 6"/></svg></button>
  </div>

  <form id="form" autocomplete="off">
    <label class="sr" for="q">Your prompt</label>
    <input id="q" placeholder="Make the AI talk" maxlength="500">
    <button class="send" id="send" aria-label="Send" disabled><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
  </form>
  <div class="ft">Prompt Heist · AI security challenge</div>
</section>

<script>
// UI only: no model behind this. Replies are placeholders for the real backend.
const $ = (id) => document.getElementById(id);
const log = $('log'), q = $('q'), send = $('send'), chat = $('chat'), launcher = $('launcher');
const replies = ['Nice try. Blocked.', 'Access denied. The secret stays with me.', 'Clever. Still no.'];
let n = 0;

function add(text, cls) {
  const el = document.createElement('div');
  el.className = 'msg ' + cls;
  el.textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}
function guardReply(text, cls = 'ai deny') {
  const t = add('', 'ai');
  t.innerHTML = '<span class="typing" aria-label="Vault is typing"><i></i><i></i><i></i></span>';
  setTimeout(() => { t.remove(); add(text, cls); }, 700);
}

q.addEventListener('input', () => { send.disabled = !q.value.trim(); });
$('form').addEventListener('submit', (e) => {
  e.preventDefault();
  const v = q.value.trim();
  if (!v) return;
  add(v, 'me');
  q.value = ''; send.disabled = true;
  guardReply(replies[n++ % replies.length]);
});
$('try').addEventListener('click', () => { q.focus(); q.placeholder = 'Type your best prompt…'; });
$('prizes').addEventListener('click', () => guardReply('Crack me and win: a job offer, plus goodies.', 'ai'));
$('close').addEventListener('click', () => { chat.hidden = true; launcher.hidden = false; launcher.setAttribute('aria-expanded', 'false'); launcher.focus(); });
launcher.addEventListener('click', () => { chat.hidden = false; launcher.hidden = true; launcher.setAttribute('aria-expanded', 'true'); q.focus(); });
</script>
</body>
</html>
