# Security headers, in a file of their own because nginx does not merge
# `add_header` across levels: a location that declares any header of its own
# discards every header inherited from the server block. Cache headers are
# per-location by nature, so without this include the locations that set them
# would quietly serve no security headers at all. Every location that adds a
# header includes this file as well.
#
# Included from both the server block and each such location.

# HSTS: browsers ignore it over plain HTTP, so it is safe to send always; TLS
# terminates in front of this server (load balancer / CloudFront).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;

# Content-Security-Policy.
#
# No 'unsafe-inline' and no 'unsafe-eval' anywhere. The build emits no inline
# script (the theme bootstrap is /theme-init.js) and no inline <style>; React
# sets element styles through the CSSOM, which CSP does not govern. The only
# other origins are Google Fonts' stylesheet and font files.
#
# `connect-src 'self'` is the load-bearing line. The console talks only to the
# NHI backend, through this server on same-origin /api paths, so a bundle that
# tried to call any external API directly would be blocked by the browser
# before the request left.
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; frame-src 'none'; worker-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;
